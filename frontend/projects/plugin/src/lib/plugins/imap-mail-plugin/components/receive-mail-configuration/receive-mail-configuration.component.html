<p style="margin-bottom: 1.5rem">{{ 'actionDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
  } as obs"
>
  <v-input
    name="senderContains"
    [title]="'senderContains' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.senderContains"
    [disabled]="obs.disabled"
    [required]="false"
    [placeholder]="'@gemeente.nl'"
    [tooltip]="'senderContainsTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="subjectContains"
    [title]="'subjectContains' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.subjectContains"
    [disabled]="obs.disabled"
    [required]="false"
    [placeholder]="'Bezwaar'"
    [tooltip]="'subjectContainsTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="recipientContains"
    [title]="'recipientContains' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.recipientContains"
    [disabled]="obs.disabled"
    [required]="false"
    [placeholder]="'bezwaar@gemeente.nl'"
    [tooltip]="'recipientContainsTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
</v-form>
